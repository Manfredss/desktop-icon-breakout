name: Linux graphics diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 adwaita-icon-theme fonts-noto-cjk xvfb
      - run: python -m pip install -r requirements-dev.txt
      - name: Inspect Qt dependencies
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import PySide6
          plugin = Path(PySide6.__file__).parent / 'Qt/plugins/platforms/libqxcb.so'
          subprocess.run(['ldd', str(plugin)], check=True)
          PY
      - name: Initialize native X11 backend
        run: xvfb-run -a env QT_DEBUG_PLUGINS=1 python -c "from PySide6.QtWidgets import QApplication; a=QApplication([]); print('QApplication ready', a.platformName())"
      - name: Test without capturing Qt errors
        run: xvfb-run -a python -m pytest -q -s
      - name: Render native icons
        run: xvfb-run -a python app.py --demo --lang en --smoke-test smoke-linux.png
